backend = 'fastresize'
color_space = 'salience'
palette = 'saliencedark'
no_hooks = false

# TODO: google "wallust sequence error"
# Error msg: Couldn't create sequence file: No such file or directory (os error 2)
[templates]
# need to add mangowc theme here
# TODO: figure out the lua way to do gradient border colors
hyprland = { template = 'hypr-colors.lua', target = '~/.config/hypr/wayle/colors.lua' }
wayle = { template = 'wayle.toml', target = '~/.config/wayle/themes/wallust.toml' }
kitty = { template = 'kitty.conf', target = '~/.config/kitty/current-theme.conf' }
niri = { template = 'niri.kdl', target = '~/.config/niri/wallust-colors.kdl' }
rofi = { template = 'rofi-colors.conf', target = '~/.config/rofi/shared/wallust-colors.rasi' }
yazi = { template = 'yazi.toml', target = '~/.config/yazi/flavors/wallust.yazi/flavor.toml' }

# stuff below all need hooks if using 'wallust theme My-Theme'.
# Too bad, atm hooks don't run after the above command,
# need to use 'wallust run'
# TODO: add qt coloring
gtk3 = { template = 'gtk.css', target = '~/.config/gtk-3.0/wallust.css' }
gtk4 = { template = 'gtk.css', target = '~/.config/gtk-4.0/wallust.css' }
zen = { template = 'zen.css', target = '~/.zen/fdj5cutv.Default (release)/chrome/wallust.css' }
# this one is kinda ahh so commenting out for now
# vesktop = { template = 'vesktop.css', target = '~/.config/vesktop/themes/wallust.css' }

[hooks]
# notif = 'notify-send "New Scheme Generated!"'
gtk3 = """echo '@import url("wallust.css")' >| "$HOME/.config/gtk-3.0/gtk.css" """
gtk4 = """echo '@import url("wallust.css")' >| "$HOME/.config/gtk-4.0/gtk.css" """
zen = """echo '@import url("wallust.css")' >| "$HOME/.zen/fdj5cutv.Default (release)/chrome/userChrome.css" """
