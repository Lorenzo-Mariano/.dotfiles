# Global section - values below can be overwritten by command line flags
backend = 'fastresize'
color_space = 'salience'
palette = 'saliencedark'
# check_contrast = true
# saturation = 35
# alpha = 100
# no_hooks = true

[templates]
kitty = { template = 'kitty.conf', target = '~/.config/kitty/current-theme.conf' }
hyprland = { template = 'hyprland-colors.conf', target = '~/.config/hypr/wallust-colors.conf' }
rofi = { template = 'rofi-colors.conf', target = '~/.config/rofi/shared/wallust-colors.rasi' }
gtk3 = { template = 'gtk.css', target = '~/.config/gtk-3.0/gtk.css' }
gtk4 = { template = 'gtk.css', target = '~/.config/gtk-4.0/gtk.css' }
zen = { template = 'zen.css', target = '~/.zen/fdj5cutv.Default (release)/chrome/userChrome.css' }
# vesktop = { template = 'vesktop.css', target = '~/.config/vesktop/themes/wallust.css' }

[hooks]
# Run commands when wallust is invoked. Useful to avoid scripting.
# wallpaper = """swww img "$(find ~/Media/Pictures/Wallpapers -iregex '.*.\\(jpg\\|jpeg\\|png\\|gif\\)' -type f | shuf -n 1)" """
