[mgr]
ratio = [0, 2, 3]
show_hidden = true
linemode = "btime"
show_symlink = true

[preview]
wrap = "yes"
max_width = 9000
max_height = 9000
image_filter = "triangle"
image_quality = 50

[opener]
run = [{ run = 'setsid "$@"', orphan = true }]
write = [{ run = 'soffice "$@"', orphan = true }]
watch = [{ run = 'mpv "$@"', orphan = true }]
view = [{ run = 'loupe "$@"', orphan = true }]
listen = [{ run = 'decibels "$@"', orphan = true }]
read = [
  { run = 'okular "$@"', orphan = true },
  { run = 'papers "$@"', orphan = true },
  { run = 'readest "$@"', orphan = true }
]
set-wallpaper = [{ run = 'awww img "$@"', orphan = true }]

[open]
prepend_rules = [
  { url = "*.AppImage", use = ["run"] },
  { mime = "image/*", use = ["view", "set-wallpaper"] },
  { mime = "audio/*", use = ["listen"] },
  { mime = "video/*", use = ["watch"] },
  { mime = "application/pdf", use = ["read"] },
  { mime = "application/epub+zip", use = ["read"] },
  # docx
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = [
    "write"
  ] },
  { url = "*.odt", use = ["write"] },
]

[plugin]
prepend_fetchers = [
  { id = "git", url = "*", run = "git", group = "git" },
  { id = "git", url = "*/", run = "git", group = "git" },
]
