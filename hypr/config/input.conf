# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =

    follow_mouse = 1
    mouse_refocus = true
    sensitivity = -0.15 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = true
        scroll_factor = 0.15
    }
}

cursor {
    persistent_warps = true
}

# wireless bt kb
device {
    name = at-translated-set-2-keyboard
    kb_options = altwin:swap_lalt_lwin
}

# magegee kb
device {
    name = sino-wealth-gaming-kb-
    kb_options = altwin:swap_lalt_lwin
}

device {
    name = asup1411:00-093a:200b-touchpad
    sensitivity = 0.65
}

# inplay mouse
device {
    name = sigmachip-usb-mouse
    sensitivity = -0.05
}

# rakk mouse
device {
    name = sino-wealth-mouse
    sensitivity = -0.85 # (at the highest DPI setting)
}

gesture = 3, horizontal, workspace
