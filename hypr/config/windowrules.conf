# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppressevent
    match:class = .*
}

# windowrule {
#     name = remove border of unfocused
#     match:focus = false
#     border_size = 1
# }

windowrule {
    name = center-floats
    match:float = 1
    persistent_size = on
    center = on
}

windowrule {
    name = undo above for krita
    match:class = krita
    center = off
}

# This makes center floats rule apply to the desktop portal picker,
# but not windows that were turned into floats
windowrule {
    name = make file picker nicer
    match:class = xdg-desktop-portal-gtk
    size = 1200 800
    float = on
}

# Fix some dragging issues with XWayland
windowrule {
    name = nofocus
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
}
